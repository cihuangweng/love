<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 替换成专属标题 + 保留OG社交元信息 -->
    <title>珊宝的专属告白❤️</title>
    <meta name="description" content="这是我专门为你做的一份小心意，点开看看吧">
    <meta property="og:title" content="珊宝，我有话想对你说 ❤️">
    <meta property="og:description" content="这是我专门为你做的一份小心意，点开看看吧">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cihuangweng.github.io/love/1.html">
    
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation; /* 解决手机端点击延迟 */
        }

        /* 页面背景和整体布局 - 适配手机 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px; /* 手机端减小内边距 */
            margin: 0;
        }

        /* 爱心容器 - 动态爱心效果 */
        .heart-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 表白卡片样式 - 适配手机 */
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px 20px; /* 手机端减小内边距 */
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px; /* 手机端缩小最大宽度 */
            width: 100%;
            z-index: 2;
            position: relative;
        }

        /* 标题样式 - 适配手机 */
        .card h1 {
            color: #e63946;
            font-size: 24px; /* 手机端缩小字体 */
            margin-bottom: 18px;
        }

        /* 表白文案样式 - 适配手机 */
        .card p {
            color: #333;
            font-size: 16px; /* 手机端缩小字体 */
            line-height: 1.7;
            margin-bottom: 25px;
        }

        /* 按钮容器 - 关键：横向排列，允许溢出挤压 */
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            overflow: visible; /* 允许按钮溢出容器，实现挤压效果 */
        }

        /* 按钮基础样式 - 适配手机 */
        .btn {
            color: white;
            border: none;
            padding: 10px 25px; /* 手机端减小内边距 */
            border-radius: 30px;
            font-size: 15px; /* 手机端缩小字体 */
            cursor: pointer;
            transition: all 0.6s ease; /* 放慢动画，更丝滑 */
            transform: scale(1);
            position: relative;
            z-index: 3;
            white-space: nowrap; /* 文字不换行 */
            flex-shrink: 0; /* 禁止按钮自身收缩，保证挤压效果 */
        }

        /* 愿意按钮样式 */
        .confirm-btn {
            background-color: #e63946;
        }

        .confirm-btn:hover, .confirm-btn:active { /* 适配手机点击态 */
            background-color: #d62828;
        }

        /* 不愿意按钮样式 */
        .refuse-btn {
            background-color: #999;
        }

        .refuse-btn:hover, .refuse-btn:active { /* 适配手机点击态 */
            background-color: #777;
        }

        /* 不愿意按钮缩小样式 */
        .btn-small {
            transform: scale(0.8); /* 手机端缩小幅度降低，更协调 */
        }

        /* 温馨动画容器 - 新增 */
        .warm-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            display: none;
        }

        .warm-heart {
            position: absolute;
            font-size: 30px;
            color: #e63946;
            opacity: 0;
            animation: warmHeartAnim 2s ease forwards;
        }

        /* 温馨爱心动画 */
        @keyframes warmHeartAnim {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0;
            }
        }

        /* 爱心下落动画 */
        @keyframes heartFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 弹窗样式 - 适配手机 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: white;
            padding: 25px 20px;
            border-radius: 15px;
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        .modal-content h2 {
            color: #e63946;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .modal-content p {
            font-size: 16px;
            line-height: 1.6;
        }

        /* 新增：先出现的提示文字样式 */
        .tip-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            color: #e63946;
            font-weight: bold;
            z-index: 105;
            display: none;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* 适配超小屏手机 */
        @media (max-width: 375px) {
            .card {
                padding: 25px 15px;
            }
            .card h1 {
                font-size: 22px;
            }
            .btn {
                padding: 8px 20px;
                font-size: 14px;
            }
            .tip-text {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态爱心容器 -->
    <div class="heart-container"></div>

    <!-- 温馨动画容器 -->
    <div class="warm-animation" id="warmAnimation"></div>

    <!-- 新增：先出现的提示文字 -->
    <div class="tip-text" id="tipText">嘻嘻，我就知道你会选我～</div>

    <!-- 表白卡片 -->
    <div class="card">
        <h1>致我最喜欢的珊宝</h1>
        <p>
            遇见你是我最大的幸运，<br>
            想和你分享所有的喜怒哀乐，<br>
            我的心只为你跳动，<br>
            你愿意和我在一起吗？
        </p>
        <!-- 按钮容器 -->
        <div class="btn-container">
            <button class="btn confirm-btn" id="confirmBtn">愿意</button>
            <button class="btn refuse-btn" id="refuseBtn">不愿意</button>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>太好啦！❤️</h2>
            <p>珊宝同意了,那就别忘了我的屏保～</p>
        </div>
    </div>

    <script>
        // 1. 动态生成爱心的函数
        function createHeart() {
            const heart = document.createElement('div');
            const size = Math.random() * 15 + 8 + 'px'; // 手机端缩小爱心尺寸
            const left = Math.random() * 100 + '%';
            const opacity = Math.random() * 0.8 + 0.2;
            
            heart.style.cssText = `
                position: absolute;
                left: ${left};
                bottom: -20px;
                font-size: ${size};
                color: #e63946;
                opacity: ${opacity};
                animation: heartFall linear ${Math.random() * 4 + 4}s forwards;
            `;
            heart.innerText = '❤️';
            document.querySelector('.heart-container').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000); // 手机端缩短爱心存活时间，减少性能消耗
        }

        // 2. 定时生成爱心（手机端降低频率，减少卡顿）
        setInterval(createHeart, 400);

        // 3. 获取元素
        const confirmBtn = document.getElementById('confirmBtn');
        const refuseBtn = document.getElementById('refuseBtn');
        const modal = document.getElementById('modal');
        const warmAnimation = document.getElementById('warmAnimation');
        const tipText = document.getElementById('tipText'); // 新增：获取提示文字元素
        
        // 核心变量
        let scaleFactor = 1; // 初始放大倍数
        const scaleStep = 1.1; // 每次放大1.2倍
        let clickCount = 0; // 记录不愿意点击次数
        const triggerTextCount = 3; // 点击3次触发"快选我"
        const hideBtnCount = 6; // 点击6次隐藏不愿意按钮
        const maxScale = 8; // 最大放大倍数（适配手机，避免过度放大）

        // 4. 不愿意按钮点击事件 - 核心逻辑
        refuseBtn.addEventListener('click', () => {
            // 累计点击次数
            clickCount++;
            
            // 第一次点击：不愿意按钮缩小
            if (clickCount === 1) {
                refuseBtn.classList.add('btn-small');
            }

            // 放大愿意按钮
            scaleFactor *= scaleStep;
            if (scaleFactor > maxScale) scaleFactor = maxScale;
            
            // 应用放大样式（实现挤压效果）
            confirmBtn.style.transform = `scale(${scaleFactor})`;
            // 同步放大内边距和字体，保证文字显示正常
            confirmBtn.style.padding = `${10 * scaleFactor}px ${25 * scaleFactor}px`;
            confirmBtn.style.fontSize = `${15 * scaleFactor}px`;

            // 点击3次：添加"快选我"可爱文字
            if (clickCount === triggerTextCount) {
                confirmBtn.innerText = '愿意 💘 快选我～';
                // 给文字加轻微抖动动画，更可爱
                confirmBtn.style.animation = 'shake 0.5s infinite';
                // 定义抖动动画
                const shakeStyle = document.createElement('style');
                shakeStyle.innerHTML = `
                    @keyframes shake {
                        0% {transform: scale(${scaleFactor}) rotate(0deg);}
                        25% {transform: scale(${scaleFactor}) rotate(2deg);}
                        50% {transform: scale(${scaleFactor}) rotate(0deg);}
                        75% {transform: scale(${scaleFactor}) rotate(-2deg);}
                        100% {transform: scale(${scaleFactor}) rotate(0deg);}
                    }
                `;
                document.head.appendChild(shakeStyle);
            }

            // 点击6次：隐藏不愿意按钮
            if (clickCount === hideBtnCount) {
                refuseBtn.style.display = 'none';
                // 禁用按钮防止后续触发
                refuseBtn.disabled = true;
            }

            // 达到最大放大倍数：禁用不愿意按钮
            if (scaleFactor >= maxScale && clickCount < hideBtnCount) {
                refuseBtn.disabled = true;
                refuseBtn.style.opacity = 0.5; // 视觉上标记禁用
            }
        });

        // 5. 愿意按钮点击事件 - 调整顺序：先文字 → 1秒后动画+弹窗
        confirmBtn.addEventListener('click', () => {
            // 第一步：显示提示文字
            tipText.style.display = 'block';

            // 第二步：1秒后隐藏文字，显示动画和弹窗
            setTimeout(() => {
                tipText.style.display = 'none'; // 隐藏文字
                showWarmAnimation(); // 播放爱心动画
                modal.style.display = 'flex'; // 显示弹窗

                // 3秒后关闭弹窗
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 3000);
            }, 1000); // 延迟1秒执行
        });

        // 6. 温馨动画函数
        function showWarmAnimation() {
            warmAnimation.style.display = 'block';
            // 生成多个爱心动画
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'warm-heart';
                // 随机位置
                const top = Math.random() * 100 + '%';
                const left = Math.random() * 100 + '%';
                // 随机大小
                const size = Math.random() * 20 + 20 + 'px';
                
                heart.style.cssText = `
                    top: ${top};
                    left: ${left};
                    font-size: ${size};
                    animation-delay: ${i * 0.1}s;
                `;
                heart.innerText = '💖';
                warmAnimation.appendChild(heart);

                // 动画结束后移除
                setTimeout(() => {
                    heart.remove();
                    if (warmAnimation.children.length === 0) {
                        warmAnimation.style.display = 'none';
                    }
                }, 2000);
            }
        }

        // 点击弹窗外区域关闭弹窗
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
